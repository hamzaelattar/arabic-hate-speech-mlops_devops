
name: Arabic Hate Speech - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: PREPARE REAL ML MODEL ARTIFACT
  # ==========================================
  prepare-model:
    name: Prepare MLflow Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 \
            --repo hamzaelattar/arabic-hate-speech-mlops_devops \
            --pattern "arabic-model-v1.zip" \
            --dir .

      - name: Extract model
        run: |
          mkdir -p artifacts
          unzip -q arabic-model-v1.zip -d artifacts

      - name: Verify MLflow model files
        run: |
          find artifacts -name MLmodel
          test "$(find artifacts -name MLmodel | wc -l)" -eq 1

      - name: Upload model as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-mlflow-model
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # ==========================================
  # JOB 2: TEST REAL MODEL
  # ==========================================
  test:
    name: Test Model
    runs-on: ubuntu-latest
    needs: prepare-model

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-mlflow-model
          path: artifacts/

      - name: Test MLflow model
        run: |
          python -m pytest tests/test_mlflow_model.py -v

      - name: Run preprocessing tests
        run: |
          if [ -f tests/test_preprocess.py ]; then
            python -m pytest tests/test_preprocess.py -v
          fi

  # ==========================================
  # JOB 3: BUILD AND TEST DOCKER IMAGE
  # ==========================================
  build-docker:
    name: Build and Test Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mlflow scikit-learn joblib

      - name: Download validated model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-mlflow-model
          path: artifacts/

      - name: Prepare joblib model for Docker
        run: |
          python - <<'PY'
          from pathlib import Path
          import joblib
          import mlflow.sklearn

          model_files = list(
              Path("artifacts").rglob("MLmodel")
          )

          assert len(model_files) == 1, (
              "Expected exactly one MLflow model"
          )

          model_dir = model_files[0].parent
          model = mlflow.sklearn.load_model(
              str(model_dir)
          )

          Path("models").mkdir(exist_ok=True)

          joblib.dump(
              model,
              "models/tfidf_logreg.joblib"
          )

          print("Real model prepared for Docker")
          PY

      - name: Build Docker image
        run: |
          docker build \
            -t arabic-hate-speech-api:${{ github.sha }} \
            .

      - name: Start API container
        run: |
          docker run -d \
            --name hate-speech-api \
            -p 8000:8000 \
            arabic-hate-speech-api:${{ github.sha }}

      - name: Wait for API and test health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs hate-speech-api
          exit 1

      - name: Test prediction endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "http://localhost:8000/predict"

          payload = json.dumps({
              "text": "انت شخص رائع"
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          assert "prediction" in result
          assert "probabilities" in result

          print("API prediction successful:", result)
          PY

      # ==========================================
      # EXPORT VALIDATED DOCKER IMAGE
      # ==========================================
      - name: Export validated Docker image
        run: |
          docker save \
            arabic-hate-speech-api:${{ github.sha }} \
            -o docker-image.tar

      - name: Upload validated Docker image
        uses: actions/upload-artifact@v4
        with:
          name: validated-docker-image
          path: docker-image.tar
          if-no-files-found: error
          retention-days: 7

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Show Docker logs on failure
        if: failure()
        run: docker logs hate-speech-api || true

      - name: Stop container
        if: always()
        run: docker rm -f hate-speech-api || true
